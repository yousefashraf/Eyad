# fly.toml app configuration file generated for eyad on 2026-09-24T21:18:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eyad'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[env]
  VITE_HMR_HOST = "eyad.fly.dev"

[mounts]
  source = "eyad_data"
  destination = "/app/data"
